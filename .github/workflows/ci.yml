name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs: a new push/PR update stops the previous run, so
# runner time is never spent on outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22.15 is the minimum supported runtime; latest 22.x catches
        # patch-level regressions, while 24.x tracks the current baseline.
        node-version: ['22.15.0', '22.x', '24.x']
        pi-version: ['0.83.0', '0.84.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select Pi SDK compatibility target
        run: npm install --no-save --ignore-scripts @earendil-works/pi-ai@${{ matrix.pi-version }} @earendil-works/pi-coding-agent@${{ matrix.pi-version }} @earendil-works/pi-tui@${{ matrix.pi-version }}
      - name: Ranking updater tests
        run: python3 -B scripts/test-update-ranking.py
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm run test:all
      - name: Real Pi API smoke test
        run: npm run test:real-api
      - name: Test-manifest self-check
        run: npm run test:selfcheck
      - name: Package dry run
        run: npm pack --dry-run
      - name: Production dependency audit
        run: npm audit --omit=dev
      - name: NAF benchmark regression gate
        run: npm run bench:gate:naf
